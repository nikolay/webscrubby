name: Publish Chrome Web Store

on:
  push:
    tags:
      - "extension-v*"
  workflow_dispatch:
    inputs:
      publish_type:
        description: "Publish behavior after review"
        required: true
        default: "DEFAULT_PUBLISH"
        type: choice
        options:
          - "DEFAULT_PUBLISH"
          - "STAGED_PUBLISH"
      submit_for_review:
        description: "Submit the uploaded package for Chrome Web Store review"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Chrome Web Store configuration
        id: cws
        run: |
          if [ -n "${CWS_EXTENSION_ID}" ] && [ -n "${CWS_PUBLISHER_ID}" ] && [ -n "${CWS_SERVICE_ACCOUNT_JSON}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Chrome Web Store upload because CWS_EXTENSION_ID, CWS_PUBLISHER_ID, or CWS_SERVICE_ACCOUNT_JSON is not configured."
          fi

      - name: Read extension version
        id: extension
        if: steps.cws.outputs.ready == 'true'
        run: |
          version="$(node -p "require('./manifest.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "package_base=webscrubby-chrome-extension-${version}" >> "$GITHUB_OUTPUT"

      - name: Ensure tag matches manifest version
        if: steps.cws.outputs.ready == 'true' && github.ref_type == 'tag'
        run: |
          expected="extension-v${{ steps.extension.outputs.version }}"
          actual="${GITHUB_REF_NAME}"
          if [ "${actual}" != "${expected}" ]; then
            echo "Tag must match manifest version. Expected ${expected}, got ${actual}." >&2
            exit 1
          fi

      - name: Validate extension
        if: steps.cws.outputs.ready == 'true'
        run: |
          node tests/scrubber.test.js
          node tests/offscreen.test.js
          node --check src/scrubber.js
          node --check background.js
          node --check content.js
          node --check offscreen.js
          node -e "for (const file of ['manifest.json','rules/query-params.json','rules.schema.json','package.json']) JSON.parse(require('fs').readFileSync(file, 'utf8'))"

      - name: Package extension
        id: package
        if: steps.cws.outputs.ready == 'true'
        env:
          CWS_CRX_PRIVATE_KEY: ${{ secrets.CWS_CRX_PRIVATE_KEY }}
        run: |
          if [ -n "${CWS_CRX_PRIVATE_KEY}" ]; then
            package_dir="${RUNNER_TEMP}/webscrubby-extension"
            bash scripts/package-extension.sh "${RUNNER_TEMP}/${{ steps.extension.outputs.package_base }}.zip" "${package_dir}"
            key_file="${RUNNER_TEMP}/webscrubby-cws-crx-private-key.pem"
            printf '%s\n' "${CWS_CRX_PRIVATE_KEY}" > "${key_file}"
            chmod 600 "${key_file}"

            chrome_bin="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
            if [ -z "${chrome_bin}" ]; then
              echo "::error::Could not find Chrome or Chromium to sign the CRX package."
              exit 1
            fi

            "${chrome_bin}" \
              --headless=new \
              --disable-gpu \
              --no-sandbox \
              --pack-extension="${package_dir}" \
              --pack-extension-key="${key_file}"
            mv "${package_dir}.crx" "${GITHUB_WORKSPACE}/${{ steps.extension.outputs.package_base }}.crx"
            echo "package_path=${GITHUB_WORKSPACE}/${{ steps.extension.outputs.package_base }}.crx" >> "$GITHUB_OUTPUT"
            echo "package_name=${{ steps.extension.outputs.package_base }}.crx" >> "$GITHUB_OUTPUT"
            echo "is_crx=true" >> "$GITHUB_OUTPUT"
          else
            bash scripts/package-extension.sh "${GITHUB_WORKSPACE}/${{ steps.extension.outputs.package_base }}.zip"
            echo "is_crx=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        id: auth
        if: steps.cws.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Verify Chrome Web Store item exists
        if: steps.cws.outputs.ready == 'true'
        run: |
          response_file="$(mktemp)"
          status="$(curl -sS --retry 3 --retry-delay 5 \
            -o "${response_file}" \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            "https://chromewebstore.googleapis.com/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}:fetchStatus")"
          cat "${response_file}"
          if [ "${status}" = "403" ] || [ "${status}" = "404" ]; then
            echo "::error::Chrome Web Store item ${CWS_EXTENSION_ID} was not found or is not accessible to the configured service account. Create the first item manually in the Developer Dashboard, then rerun this workflow for updates."
            exit 1
          fi
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::error::Chrome Web Store item preflight failed with HTTP ${status}."
            exit 1
          fi

      - name: Upload package to Chrome Web Store
        if: steps.cws.outputs.ready == 'true'
        run: |
          response_file="$(mktemp)"
          headers=(
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}"
          )
          if [ "${{ steps.package.outputs.is_crx }}" = "true" ]; then
            headers+=(
              -H "X-Goog-Upload-Protocol: raw"
              -H "X-Goog-Upload-File-Name: ${{ steps.package.outputs.package_name }}"
            )
          fi
          status="$(curl -sS --retry 3 --retry-delay 5 \
            -o "${response_file}" \
            -w "%{http_code}" \
            "${headers[@]}" \
            -X POST \
            -T "${{ steps.package.outputs.package_path }}" \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}:upload")"
          cat "${response_file}"
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::error::Chrome Web Store upload failed with HTTP ${status}."
            exit 1
          fi

      - name: Fetch upload status
        if: steps.cws.outputs.ready == 'true'
        run: |
          response_file="$(mktemp)"
          status="$(curl -sS --retry 3 --retry-delay 5 \
            -o "${response_file}" \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            "https://chromewebstore.googleapis.com/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}:fetchStatus")"
          cat "${response_file}"
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::error::Chrome Web Store status fetch failed with HTTP ${status}."
            exit 1
          fi

      - name: Submit for review
        if: steps.cws.outputs.ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.submit_for_review)
        run: |
          publish_type="${{ inputs.publish_type || 'DEFAULT_PUBLISH' }}"
          response_file="$(mktemp)"
          status="$(curl -sS --retry 3 --retry-delay 5 \
            -o "${response_file}" \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            -X POST \
            -d "{\"publishType\":\"${publish_type}\"}" \
            "https://chromewebstore.googleapis.com/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}:publish")"
          cat "${response_file}"
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::error::Chrome Web Store publish failed with HTTP ${status}."
            exit 1
          fi

